name: bonsai

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/bonsai.yml

permissions:
  contents: write

concurrency:
  group: bonsai-${{ github.ref }}
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: egorthinks/git-bonsai@main
        with:
          commit: 'false'
      - name: Commit bonsai
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "bonsai unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore: tend the bonsai 🌳"
          git push
